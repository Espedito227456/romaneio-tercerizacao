<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AGI - Trocar Senha</title>
    <link rel="stylesheet" href="css/cadastro.css" />
  </head>
  <body class="cadastro-page">
    <main class="cadastro-shell">
      <div class="cadastro-card" role="main">
        <header class="brand" aria-label="AGI Brasil">
          <img class="logo-agi" src="assets/agi-logo.svg" alt="AGI Brasil" />
          <span class="brand-tag">From field to future</span>
        </header>

        <form id="trocaSenhaForm" class="cadastro-form" novalidate>
          <div class="field">
            <label for="senha">NOVA SENHA:</label>
            <div class="password-wrap">
              <input id="senha" name="senha" type="password" autocomplete="new-password" />
              <button type="button" class="toggle-password" aria-label="Mostrar senha" title="Mostrar senha">
                <svg class="eye-icon" viewBox="0 0 24 24" aria-hidden="true">
                  <path class="eye-shape" d="M1.5 12S5 6 12 6s10.5 6 10.5 6-3.5 6-10.5 6S1.5 12 1.5 12Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                  <circle class="eye-pupil" cx="12" cy="12" r="2.8" fill="currentColor"/>
                  <path class="eye-slash" d="M4 4L20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                </svg>
              </button>
            </div>
          </div>

          <div class="field">
            <label for="confirmarSenha">CONFIRMAR NOVA SENHA:</label>
            <div class="password-wrap">
              <input id="confirmarSenha" name="confirmarSenha" type="password" autocomplete="new-password" />
              <button type="button" class="toggle-password" aria-label="Mostrar senha" title="Mostrar senha">
                <svg class="eye-icon" viewBox="0 0 24 24" aria-hidden="true">
                  <path class="eye-shape" d="M1.5 12S5 6 12 6s10.5 6 10.5 6-3.5 6-10.5 6S1.5 12 1.5 12Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                  <circle class="eye-pupil" cx="12" cy="12" r="2.8" fill="currentColor"/>
                  <path class="eye-slash" d="M4 4L20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                </svg>
              </button>
            </div>
          </div>

          <p class="form-message" id="formMessage" aria-live="polite"></p>
          <button type="submit" class="submit-btn">ALTERAR SENHA</button>
        </form>

        <div class="footer-link">
          <a href="remessa.html">Voltar</a>
        </div>
      </div>
    </main>

    <script defer src="js/auth.js"></script>
    <script defer src="js/troca-senha.js"></script>
  </body>
</html>
